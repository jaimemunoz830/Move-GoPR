<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotización - Move & Go PR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HERO -->
<header class="subpage-hero text-center text-white py-4">
    <div class="container">
        <h1 class="fw-bold">Solicitar Cotización</h1>
        <p>Completa el formulario y te responderemos lo antes posible</p>

        <!-- BOTÓN VOLVER -->
        <a href="index.html" class="btn btn-light mt-3">
            ← Volver al Inicio
        </a>
    </div>
</header>

<!-- FORMULARIO -->
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <form id="cotizacionForm" class="quote-form p-4">

                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de Servicio</label>
                    <select class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option>Bienes Raíces</option>
                        <option>Mudanza</option>
                        <option>Mantenimiento</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción del Servicio</label>
                    <textarea class="form-control" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Enviar por WhatsApp
                </button>

            </form>

        </div>
    </div>
</section>

<script>
document.getElementById("cotizacionForm").addEventListener("submit", function(e){
    e.preventDefault();

    const inputs = this.querySelectorAll("input, select, textarea");

    const nombre = inputs[0].value;
    const telefono = inputs[1].value;
    const email = inputs[2].value;
    const servicio = inputs[3].value;
    const descripcion = inputs[4].value;

    const mensaje = `Hola Move & Go PR,%0A
Nombre: ${nombre}%0A
Teléfono: ${telefono}%0A
Email: ${email}%0A
Servicio: ${servicio}%0A
Descripción: ${descripcion}`;

    window.open(`https://wa.me/17875438201?text=${mensaje}`, "_blank");
});
</script>

</body>
</html>
