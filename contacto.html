    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER UNIVERSAL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Move & Go PR</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html#sobre-nosotros">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="subpage-hero d-flex align-items-center">
    <div class="container text-center">
        <h1 class="display-5 fw-bold text-white">Contáctanos</h1>
        <p class="lead text-white-50">Estamos aquí para ayudarte</p>
    </div>
</header>

<section class="container py-5">
    <h2 class="mb-4">Formulario de Contacto</h2>

    <form class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
        </div>

        <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" placeholder="Tu número">
        </div>

        <div class="col-12">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" placeholder="email@example.com">
        </div>

        <div class="col-12">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <div class="col-12">
            <button class="btn btn-primary btn-lg">Enviar Mensaje</button>
        </div>
    </form>

</section>
